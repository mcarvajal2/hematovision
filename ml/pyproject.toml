[project]
name = "hematovision-ml"
version = "0.1.0"
description = "Training and evaluation tooling for HematoVision"
requires-python = ">=3.11,<3.13"
dependencies = [
  "tensorflow>=2.16,<2.20",
  "keras>=3.0,<4.0",
  "numpy>=1.26,<3.0",
  "pillow>=10.0,<12.0",
  "scikit-learn>=1.4,<2.0",
]

[dependency-groups]
dev = [
  "jupyterlab>=4.0,<5.0",
  "pytest>=8.0,<9.0",
  "ruff>=0.8,<1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
